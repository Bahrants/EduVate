<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduVate - AI Tutor</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
  <style>
    :root {
      --neon-blue: #00f3ff;
      --cyber-purple: #6c00ff;
      --matrix-green: #00ff88;
      --dark-bg: #0a0a12;
      --header-font: 'Orbitron', sans-serif;
      --body-font: 'Rajdhani', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--body-font);
      background: var(--dark-bg);
      color: white;
      overflow-x: hidden;
    }

    .cyber-logo {
      position: fixed;
      top: 20px;
      left: 30px;
      font-family: var(--header-font);
      font-size: 2rem;
      background: linear-gradient(45deg, var(--matrix-green), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: logoGlow 2s ease-in-out infinite alternate;
      z-index: 1000;
    }

    .ai-container {
      max-width: 800px;
      margin: 100px auto 2rem;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      border: 1px solid var(--neon-blue);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
    }

    .chat-container {
      height: 60vh;
      overflow-y: auto;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      margin: 1rem 0;
      border: 1px solid rgba(0, 243, 255, 0.1);
    }

    .message {
      margin: 1rem 0;
      padding: 1.5rem;
      border-radius: 8px;
      animation: messageAppear 0.3s ease-out;
      position: relative;
    }

    .user-message {
      background: linear-gradient(90deg, rgba(0, 243, 255, 0.1) 0%, transparent 100%);
      border-left: 3px solid var(--neon-blue);
      margin-left: 20%;
    }

    .ai-message {
      background: linear-gradient(90deg, rgba(0, 255, 136, 0.1) 0%, transparent 100%);
      border-right: 3px solid var(--matrix-green);
      margin-right: 20%;
    }

    .input-container {
      display: flex;
      gap: 1rem;
      position: relative;
      margin-top: 1rem;
    }

    #ai-input {
      flex: 1;
      padding: 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--neon-blue);
      color: white;
      border-radius: 8px;
      font-family: var(--body-font);
      font-size: 1.1rem;
      transition: all 0.3s;
    }

    #ai-input:focus {
      outline: none;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
      border-color: var(--matrix-green);
    }

    #ai-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    #send-btn {
      padding: 1rem 2rem;
      background: linear-gradient(45deg, var(--matrix-green), var(--neon-blue));
      border: none;
      border-radius: 8px;
      color: var(--dark-bg);
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
    }

    .quick-questions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }

    .quick-question {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--neon-blue);
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .quick-question:hover {
      background: var(--matrix-green);
      color: var(--dark-bg);
      transform: translateY(-2px);
    }

    .file-upload {
      margin: 1rem 0;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(0, 243, 255, 0.1);
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .file-label:hover {
      background: rgba(0, 243, 255, 0.2);
    }

    /* Back Button Styles */
    .back-button {
      position: fixed;
      top: 20px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--neon-blue);
      color: white;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: var(--body-font);
      font-size: 1rem;
      text-decoration: none;
      z-index: 1000;
    }

    .back-button:hover {
      background: var(--neon-blue);
      color: var(--dark-bg);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
    }

    @keyframes messageAppear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes logoGlow {
      from { text-shadow: 0 0 10px var(--matrix-green); }
      to { text-shadow: 0 0 20px var(--neon-blue), 0 0 30px var(--cyber-purple); }
    }
  </style>
</head>
<body>
  <div class="cyber-logo">
    EDUVATE<span style="color: var(--neon-blue);">//AI</span>
  </div>

  <!-- Back Button -->
  <a href="index.html" class="back-button">
    <i class="fas fa-arrow-left"></i>
    Back to Dashboard
  </a>

  <div class="ai-container">
    <div class="chat-container" id="chat-container">
      <div class="message ai-message">
        <p>🚀 Welcome to EduVate AI Tutor! How can I assist your learning today?</p>
        <div class="quick-questions">
          <div class="quick-question">Spanish Grammar Help</div>
          <div class="quick-question">Math Problem Solving</div>
          <div class="quick-question">Science Concepts</div>
          <div class="quick-question">Language Practice</div>
        </div>
      </div>
    </div>

    <div class="input-container">
      <input type="text" id="ai-input" placeholder="Ask your learning question...">
      <button id="send-btn">
        <i class="fas fa-paper-plane"></i>
        Send
      </button>
    </div>

    <div class="file-upload">
      <label class="file-label">
        <i class="fas fa-image"></i>
        Upload Study Material
        <input type="file" hidden>
      </label>
    </div>
  </div>

  <!-- Add your AI integration scripts here -->
</body>
</html>
